// Convertit une ligne renvoyée par le Google Apps Script en objet candidat du CRM
function mapSheetRow(row) {
  return {
    id: row.id,
    nom: row.nom || "(sans nom)",
    ville: row.ville || "",
    institut: row.institut || "",
    instType: "",
    cycle: row.cycle || "",
    specialite: row.specialite || "",
    situation: row.situation || "",
    bootcamp: row.bootcamp === "non" ? "non" : "oui",
    tel: (row.tel || "").toString(),
    pays: row.pays || "",
    agent: row.agent || null,
    status: row.status || "nouveau",
    pack: row.pack || null,
    customPrice: row.customPrice ?? null,
    createdAt: row.createdAt || new Date().toISOString(),
    lastContactAt: row.lastContactAt || null,
    notes: Array.isArray(row.notes) ? row.notes : [],
  };
}

// Envoie une mise à jour vers le Google Sheet (fire-and-forget). text/plain évite le préflight CORS.
function syncToSheet(id, patch) {
  if (!API_URL) return;
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ id, ...patch }),
  }).catch((err) => console.error("Sync Google Sheet échouée :", err));
}

function timeAgo(iso) {
  if (!iso) return "jamais";
  const d = new Date(iso);
  const days = Math.floor((Date.now() - d) / (1000 * 60 * 60 * 24));
  if (days < 1) return "aujourd'hui";
  if (days === 1) return "hier";
  return `il y a ${days} j`;
}
function hoursSince(iso) {
  if (!iso) return Infinity;
  return (Date.now() - new Date(iso)) / (1000 * 60 * 60);
}
function initials(nom) {
  return nom.split(" ").slice(0, 2).map((n) => n[0]).join("").toUpperCase();
}

// Score basé sur la fraîcheur : moins de 24h = hot, 24-48h = warm, plus de 48h = cold
// (basé sur le dernier contact, ou la date d'ajout si jamais contacté)
function computeScore(c) {
  const ref = c.lastContactAt || c.createdAt;
  const hours = hoursSince(ref);
  if (hours < 24) return "hot";
  if (hours < 48) return "warm";
  return "cold";
}
const SCORE_ORDER = { hot: 0, warm: 1, cold: 2 };

function waLink(c) {

  const phone = "216" + c.tel.replace(/\s/g, "");

    paye: `Bonjour ${c.nom.split(" ")[0]}, bienvenue chez Mission:Hired 🎉 Votre inscription est confirmée, on vous envoie le programme très vite.`,
    rejete: `Bonjour ${c.nom.split(" ")[0]}, merci pour votre temps. N'hésitez pas à revenir vers nous si votre situation évolue !`,

  return `https://wa.me/${phone}?text=${encodeURIComponent(messages[c.status] || messages.nouveau)}`;

      try {
        const res = await fetch(API_URL);
        const rows = await res.json();

          setCandidates(rows.map(mapSheetRow));
          setSyncError(null);
        }

      } finally {
        if (!cancelled) setLoading(false);
      }

    const interval = setInterval(load, 45000);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

    const c = candidates.find((x) => x.id === id);
    const now = new Date();
    const dateLabel = String(now.getDate()).padStart(2, "0") + "/" + String(now.getMonth() + 1).padStart(2, "0") + " " + now.toTimeString().slice(0, 5);
    const note = { author: currentAgent, date: dateLabel, text: noteDraft.trim() };
    updateCandidate(id, { notes: [...c.notes, note], lastContactAt: now.toISOString() });
    setNoteDraft("");
  }
  function reassign(id, agent) { updateCandidate(id, { agent, status: agent ? "attribue" : "nouveau" }); }

  const filtered = useMemo(() => {
    let list = [...enriched];
    if (role === "agent") {
      if (filterScope === "mine") list = list.filter((c) => c.agent === currentAgent);
      if (filterScope === "unassigned") list = list.filter((c) => !c.agent);
    } else if (filterAgentAdmin !== "all") {
      list = list.filter((c) => c.agent === filterAgentAdmin);
    }
    if (view === "relance") list = list.filter((c) => c.status === "injoignable" && (role === "admin" || c.agent === currentAgent));
    // Les rejetés sont masqués par défaut ; ils restent visibles si on filtre explicitement dessus
    if (filterStatus === "all") list = list.filter((c) => c.status !== "rejete");
    if (filterStatus !== "all") list = list.filter((c) => c.status === filterStatus);
    if (filterScore !== "all") list = list.filter((c) => c.score === filterScore);
    if (filterCycle !== "all") list = list.filter((c) => c.cycle === filterCycle);
    if (filterBootcamp !== "all") list = list.filter((c) => c.bootcamp === filterBootcamp);
    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter((c) => [c.nom, c.ville, c.institut, c.specialite].join(" ").toLowerCase().includes(q));
    }
    // Tri : hot d'abord, puis warm, puis cold — et dans chaque groupe, du plus récent au plus ancien
    return list.sort((a, b) => {
      const sd = SCORE_ORDER[a.score] - SCORE_ORDER[b.score];
      if (sd !== 0) return sd;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
  }, [enriched, role, filterScope, filterStatus, filterScore, filterCycle, filterBootcamp, filterAgentAdmin, view, search, currentAgent]);

  const stats = useMemo(() => {
    const unassigned = enriched.filter((c) => !c.agent).length;
    const mine = enriched.filter((c) => c.agent === currentAgent).length;
    const toFollowUp = enriched.filter((c) => c.status === "injoignable" && c.agent === currentAgent).length;
    const hotMine = enriched.filter((c) => c.agent === currentAgent && c.score === "hot" && !["paye", "rejete"].includes(c.status)).length;
    return { unassigned, mine, toFollowUp, hotMine };
  }, [enriched, currentAgent]);

  const admin = useMemo(() => {
    const paid = enriched.filter((c) => c.status === "paye");
    const revenue = paid.reduce((sum, c) => sum + (c.customPrice ?? prices[c.pack] ?? 0), 0);
    const standardCount = paid.filter((c) => c.pack === "standard").length;
    const premiumCount = paid.filter((c) => c.pack === "premium").length;
    const relances = enriched.filter((c) => c.status === "injoignable").length;
    const perAgent = AGENTS.map((a) => {
      const mine = enriched.filter((c) => c.agent === a);
      const paidMine = mine.filter((c) => c.status === "paye");
      const rev = paidMine.reduce((sum, c) => sum + (c.customPrice ?? prices[c.pack] ?? 0), 0);
      return {
        agent: a, total: mine.length,
        contactes: mine.filter((c) => ["contacte", "interesse", "paye", "rejete", "injoignable"].includes(c.status)).length,
        payes: paidMine.length,
        taux: mine.length ? Math.round((paidMine.length / mine.length) * 100) : 0,
        revenu: rev,
      };
    });
    return { revenue, standardCount, premiumCount, perAgent, totalPaid: paid.length, relances };
  }, [enriched, prices]);

  if (loading) {
    return (
      <div className="min-h-screen w-full flex items-center justify-center" style={{ backgroundColor: "#F7F9F8", color: BRAND.ink }}>
        <div className="text-sm font-medium">Chargement des candidats depuis le Google Sheet…</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: "#F7F9F8" }}>
      {syncError && (
        <div className="px-6 py-2 text-xs font-medium text-center" style={{ backgroundColor: "#FEF2F2", color: "#B91C1C" }}>
          ⚠️ {syncError} Les modifications ne sont peut-être pas sauvegardées.
        </div>
      )}
      <div className="sticky top-0 z-20 flex items-center justify-between px-6 py-3" style={{ backgroundColor: BRAND.ink }}>
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-sm" style={{ backgroundColor: BRAND.soft }}>✨</div>
          <div className="text-white font-semibold tracking-tight text-[15px]">
            Mission<span style={{ color: BRAND.soft }}>:</span>Hired <span className="font-normal opacity-60 text-xs ml-1">CRM</span>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex rounded-lg p-0.5" style={{ backgroundColor: "rgba(255,255,255,0.1)" }}>
            {(isAdmin ? ["agent", "admin"] : ["agent"]).map((r) => (
              <button key={r} onClick={() => {
                if (r === "admin" && !adminUnlocked) {
                  const pwd = window.prompt("Mot de passe admin :");
                  if (pwd !== ADMIN_PASSWORD) { if (pwd !== null) alert("Mot de passe incorrect."); return; }
                  setAdminUnlocked(true);
                }
                setRole(r); setSelectedId(null); setView("liste");
              }}
                className="px-3.5 py-1.5 rounded-md text-xs font-medium capitalize transition-colors"
                style={role === r ? { backgroundColor: BRAND.soft, color: BRAND.ink } : { color: "rgba(255,255,255,0.75)" }}>
                {r === "agent" ? "Agent" : "Admin"}
              </button>
            ))}
          </div>
          {role === "agent" && (
            <select value={currentAgent} onChange={(e) => {
              const a = e.target.value;
              setCurrentAgent(a);
              if (!ADMINS.includes(a)) { setRole("agent"); }
            }}
              className="text-xs rounded-md px-2.5 py-2 border-0 outline-none"
              style={{ backgroundColor: "rgba(255,255,255,0.1)", color: "white" }}>
              {AGENTS.map((a) => <option key={a} value={a} style={{ color: "black" }}>Connecté : {a}{ADMINS.includes(a) ? " (admin)" : ""}</option>)}
            </select>
          )}
        </div>
      </div>

      {role === "agent" ? (
        <div className="max-w-7xl mx-auto px-6 py-6">
          <div className="grid grid-cols-4 gap-3 mb-5">
            <StatChip icon="👥" label="Non attribués" value={stats.unassigned} />
            <StatChip icon="👤" label={`Mes candidats (${currentAgent})`} value={stats.mine} />
            <StatChip icon="⏰" label="À relancer aujourd'hui" value={stats.toFollowUp} highlight="amber" />
            <StatChip icon="🔥" label="Hot leads (à moi)" value={stats.hotMine} highlight="hot" />
          </div>

          <div className="flex items-center gap-2 mb-4">
            <div className="flex rounded-lg border border-slate-200 bg-white overflow-hidden">
              {[["liste", "Toutes les fiches"], ["relance", `À relancer${stats.toFollowUp ? ` (${stats.toFollowUp})` : ""}`]].map(([v, l]) => (
                <button key={v} onClick={() => setView(v)} className="px-3.5 py-2 text-sm font-medium"
                  style={view === v ? { backgroundColor: BRAND.ink, color: "white" } : { color: "#64748b" }}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          <FilterBar search={search} setSearch={setSearch} filterStatus={filterStatus} setFilterStatus={setFilterStatus}
            filterScore={filterScore} setFilterScore={setFilterScore} filterCycle={filterCycle} setFilterCycle={setFilterCycle}
            filterBootcamp={filterBootcamp} setFilterBootcamp={setFilterBootcamp} filterScope={filterScope} setFilterScope={setFilterScope} showScope />

          <CandidateTable list={filtered} onOpen={setSelectedId} onAssign={assignToMe} showAgentCol />
        </div>
      ) : (
        <div className="max-w-7xl mx-auto px-6 py-6">
          <div className="grid grid-cols-5 gap-3 mb-5">
            <AdminCard icon="💰" label="Total encaissé" value={`${admin.revenue.toLocaleString()} DT`} />
            <AdminCard icon="✅" label="Candidats payés" value={admin.totalPaid} />
            <AdminCard icon="🛡️" label="Pack Standard" value={`${admin.standardCount} · ${(admin.standardCount * prices.standard).toLocaleString()} DT`} />
            <AdminCard icon="✨" label="Pack Premium" value={`${admin.premiumCount} · ${(admin.premiumCount * prices.premium).toLocaleString()} DT`} />
            <AdminCard icon="⚠️" label="À relancer (équipe)" value={admin.relances} />
          </div>

          <div className="grid grid-cols-[1fr_280px] gap-4 mb-5 items-start">
            <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2 text-sm font-semibold text-slate-700">
                📈 Performance par agent
              </div>
              <div className="grid grid-cols-6 gap-3 px-4 py-2 text-xs font-medium text-slate-400 uppercase tracking-wide border-b border-slate-100">
                <div>Agent</div><div>Attribués</div><div>Contactés</div><div>Payés</div><div>Taux</div><div>Revenu généré</div>
              </div>
              {admin.perAgent.map((a) => (
                <div key={a.agent} className="grid grid-cols-6 gap-3 px-4 py-3 border-b border-slate-50 last:border-0 text-sm">
                  <div className="font-medium text-slate-800">{a.agent}</div>
                  <div className="text-slate-600">{a.total}</div>
                  <div className="text-slate-600">{a.contactes}</div>
                  <div className="text-slate-600">{a.payes}</div>
                  <div style={{ color: BRAND.mid, fontWeight: 600 }}>{a.taux}%</div>
                  <div className="text-slate-600">{a.revenu.toLocaleString()} DT</div>
                </div>
              ))}
            </div>

            <div className="bg-white rounded-xl border border-slate-200 p-4">
              <div className="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3">⚙️ Tarifs des packs</div>
              <div className="space-y-3">
                <PriceInput label="Standard" value={prices.standard} onChange={(v) => setPrices((p) => ({ ...p, standard: v }))} />
                <PriceInput label="Premium" value={prices.premium} onChange={(v) => setPrices((p) => ({ ...p, premium: v }))} />
              </div>
              <div className="text-[11px] text-slate-400 mt-3">Modifiable à tout moment — recalcule automatiquement les revenus.</div>
            </div>
          </div>

          <div className="flex items-center gap-2 mb-4">
            <div className="flex rounded-lg border border-slate-200 bg-white overflow-hidden">
              {[["liste", "Toutes les fiches"], ["relance", `À relancer${admin.relances ? ` (${admin.relances})` : ""}`]].map(([v, l]) => (
                <button key={v} onClick={() => setView(v)} className="px-3.5 py-2 text-sm font-medium"
                  style={view === v ? { backgroundColor: BRAND.ink, color: "white" } : { color: "#64748b" }}>
                  {l}
                </button>
              ))}
            </div>
            <select value={filterAgentAdmin} onChange={(e) => setFilterAgentAdmin(e.target.value)}
              className="rounded-lg border border-slate-200 bg-white text-sm px-3 py-2 outline-none">
              <option value="all">Tous les agents</option>
              {AGENTS.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>

          <FilterBar search={search} setSearch={setSearch} filterStatus={filterStatus} setFilterStatus={setFilterStatus}
            filterScore={filterScore} setFilterScore={setFilterScore} filterCycle={filterCycle} setFilterCycle={setFilterCycle}
            filterBootcamp={filterBootcamp} setFilterBootcamp={setFilterBootcamp} />

          <CandidateTable list={filtered} onOpen={setSelectedId} showAgentCol showReassign reassign={reassign} />
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-30 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(4,52,44,0.35)" }} onClick={() => setSelectedId(null)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[88vh] overflow-hidden flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="px-6 py-5 flex items-start justify-between" style={{ backgroundColor: BRAND.ink }}>
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-full flex items-center justify-center text-sm font-semibold shrink-0" style={{ backgroundColor: BRAND.soft, color: BRAND.ink }}>
                  {initials(selected.nom)}
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="text-lg font-semibold text-white">{selected.nom}</div>
                    <ScoreBadge score={selected.score} />
                    {selected.bootcamp === "non" && (
                      <span className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold bg-red-100 text-red-700">
                        👎 A dit non au formulaire
                      </span>
                    )}
                  </div>
                  <div className="text-xs mt-0.5" style={{ color: BRAND.soft }}>
                    {selected.ville} · Ajouté {timeAgo(selected.createdAt)} · Dernier contact {timeAgo(selected.lastContactAt)}
                  </div>
                </div>
              </div>
              <button onClick={() => setSelectedId(null)} className="text-white/70 hover:text-white shrink-0 text-lg">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-6 p-6 overflow-y-auto">
              <div className="space-y-5">
                <div className="grid grid-cols-2 gap-3 text-sm">
                  <Field label="Institut" value={selected.instType ? `${selected.institut} (${selected.instType})` : selected.institut} />
                  <Field label="Niveau" value={selected.cycle} />
                  <Field label="Spécialité" value={selected.specialite} span2 />
                  <Field label="Situation" value={selected.situation} span2 />
                  <Field label="Téléphone" value={selected.tel || "—"} />
                  <Field label="Agent" value={selected.agent || "Non attribué"} />
                  <Field label="Pays visés" value={selected.pays} span2 />
                </div>

                {!selected.agent && (
                  <button onClick={() => assignToMe(selected.id)} className="w-full py-2.5 rounded-lg text-white text-sm font-medium" style={{ backgroundColor: BRAND.mid }}>
                    M'attribuer cette fiche
                  </button>
                )}

                <div>
                  <div className="text-xs font-medium text-slate-400 uppercase tracking-wide mb-2">Statut</div>
                  <div className="flex flex-wrap gap-1.5">
                    {STATUS_ORDER.map((s) => (
                      <button key={s} onClick={() => setStatus(selected.id, s)}
                        className="rounded-full border px-2.5 py-1 text-xs font-medium"
                        style={selected.status === s
                          ? { color: STATUS[s].fg, backgroundColor: STATUS[s].bg, borderColor: STATUS[s].fg }
                          : { color: "#94a3b8", backgroundColor: "white", borderColor: "#E2E8F0" }}>
                        {STATUS[s].label}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="text-xs font-medium text-slate-400 uppercase tracking-wide mb-2">Paiement</div>
                  <div className="flex gap-2">
                    {["standard", "premium"].map((p) => (
                      <button key={p} onClick={() => setPack(selected.id, p)}
                        className="flex-1 rounded-lg border py-2 text-sm font-medium capitalize"
                        style={selected.pack === p
                          ? { backgroundColor: BRAND.ink, color: "white", borderColor: BRAND.ink }
                          : { color: BRAND.ink, borderColor: BRAND.mintBorder, backgroundColor: BRAND.mint }}>
                        {p} · {prices[p]} DT
                      </button>
                    ))}
                  </div>
                  {selected.status === "paye" && selected.customPrice != null && selected.customPrice !== prices[selected.pack] && (
                    <div className="text-xs mt-1.5" style={{ color: BRAND.mid }}>
                      Montant réellement payé : <strong>{selected.customPrice} DT</strong>
                    </div>
                  )}
                </div>

                <a href={waLink(selected)} target="_blank" rel="noreferrer"
                  className="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg text-sm font-medium text-white"
                  style={{ backgroundColor: "#25D366" }}>
                  💬 Envoyer un message WhatsApp
                </a>
              </div>

              <div className="border-l border-slate-100 pl-6 flex flex-col">
                <div className="text-xs font-medium text-slate-400 uppercase tracking-wide mb-2">Notes & suivi</div>
                <div className="space-y-2 mb-3 flex-1 overflow-y-auto max-h-80">
                  {selected.notes.length === 0 && <div className="text-sm text-slate-300 italic">Aucune note pour l'instant.</div>}
                  {selected.notes.map((n, i) => (
                    <div key={i} className="bg-slate-50 rounded-lg px-3 py-2 text-sm">
                      <div className="text-xs text-slate-400 mb-0.5">{n.author} · {n.date}</div>
                      <div className="text-slate-700">{n.text}</div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && addNote(selected.id)}
                    placeholder="Ajouter une note d'appel…"
                    className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#1D9E75]" />
                  <button onClick={() => addNote(selected.id)} className="rounded-lg px-3" style={{ backgroundColor: BRAND.mint }}>➕</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PriceInput({ label, value, onChange }) {
  return (
    <div className="flex items-center justify-between gap-3">
      <div className="text-sm text-slate-600">{label}</div>
      <div className="flex items-center gap-1.5">
        <input type="number" value={value} onChange={(e) => onChange(Number(e.target.value))}
          className="w-20 text-sm border border-slate-200 rounded-md px-2 py-1.5 outline-none focus:border-[#1D9E75] text-right" />
        <span className="text-xs text-slate-400">DT</span>
      </div>
    </div>
  );
}

function FilterBar({ search, setSearch, filterStatus, setFilterStatus, filterScore, setFilterScore, filterCycle, setFilterCycle, filterBootcamp, setFilterBootcamp, filterScope, setFilterScope, showScope }) {
  return (
    <div className="flex flex-wrap items-center gap-2 mb-4">
      <div className="relative flex-1 min-w-[200px]">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
        <input value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="Rechercher un nom, une ville, un institut…"
          className="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 bg-white text-sm outline-none focus:border-[#1D9E75]" />
      </div>
      <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="rounded-lg border border-slate-200 bg-white text-sm px-3 py-2 outline-none">
        <option value="all">Tous les statuts</option>
        {STATUS_ORDER.map((s) => <option key={s} value={s}>{STATUS[s].label}</option>)}
      </select>
      <select value={filterScore} onChange={(e) => setFilterScore(e.target.value)} className="rounded-lg border border-slate-200 bg-white text-sm px-3 py-2 outline-none">
        <option value="all">Tous les scores</option>
        <option value="hot">🔥 Hot</option>
        <option value="warm">⭐ Warm</option>
        <option value="cold">❄️ Cold</option>
      </select>
      <select value={filterCycle} onChange={(e) => setFilterCycle(e.target.value)} className="rounded-lg border border-slate-200 bg-white text-sm px-3 py-2 outline-none">
        <option value="all">Tous les niveaux</option>
        {CYCLES.map((c) => <option key={c} value={c}>{c}</option>)}
      </select>
      <select value={filterBootcamp} onChange={(e) => setFilterBootcamp(e.target.value)} className="rounded-lg border border-slate-200 bg-white text-sm px-3 py-2 outline-none">
        <option value="all">Intéressé (formulaire) : tous</option>
        <option value="oui">Intéressé : Oui</option>
        <option value="non">Intéressé : Non</option>
      </select>
      {showScope && (
        <div className="flex rounded-lg border border-slate-200 bg-white overflow-hidden">
          {[["all", "Tous"], ["mine", "Mes fiches"], ["unassigned", "Non attribués"]].map(([v, l]) => (
            <button key={v} onClick={() => setFilterScope(v)} className="px-3 py-2 text-sm"
              style={v === filterScope ? { backgroundColor: BRAND.mint, color: BRAND.ink, fontWeight: 600 } : { color: "#64748b" }}>
              {l}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function CandidateTable({ list, onOpen, onAssign, showAgentCol, showReassign, reassign }) {
  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-slate-400 border-b border-slate-100 uppercase tracking-wide">
        <div className="w-9 shrink-0" />
        <div className="flex-1">Candidat</div>
        <div className="w-36 shrink-0">Statut</div>
        {showAgentCol && <div className="w-20 shrink-0">Agent</div>}
        <div className="w-24 shrink-0 text-right">Dernier contact</div>
        <div className="w-28 shrink-0 text-right">Action</div>
      </div>
      {list.map((c) => {
        const stale = !c.agent && hoursSince(c.createdAt) > 24;
        return (
          <div key={c.id} onClick={() => onOpen(c.id)}
            className="flex items-center gap-3 px-4 py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 cursor-pointer transition-colors"
            style={stale ? { backgroundColor: "#FEF2F2" } : {}}>
            <div className="w-9 h-9 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0"
              style={{ backgroundColor: BRAND.mint, color: BRAND.ink }}>
              {initials(c.nom)}
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-sm font-medium text-slate-800 truncate">{c.nom}</span>
                <ScoreBadge score={c.score} />
                {c.bootcamp === "non" && (
                  <span className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[10px] font-semibold bg-red-50 text-red-600">
                    👎 Non au formulaire
                  </span>
                )}
                {stale && <span className="text-[10px] font-semibold text-red-600 flex items-center gap-0.5">⚠️ +24h non traité</span>}
              </div>
              <div className="text-xs text-slate-400 truncate">{c.ville} · {c.institut} · {c.cycle} · {c.specialite}</div>
            </div>
            <div className="w-36 shrink-0 flex items-center gap-1.5">
              <StatusBadge status={c.status} />
              {(c.status === "injoignable" || c.status === "contacte") && c.tel && (
                <a href={waLink(c)} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()}
                  title={c.status === "injoignable" ? "Envoyer le message 'injoignable'" : "Envoyer le message 'confirmation'"}
                  className="w-6 h-6 shrink-0 rounded-full flex items-center justify-center text-white text-xs"
                  style={{ backgroundColor: "#25D366" }}>
                  💬
                </a>
              )}
            </div>
            {showAgentCol && (
              <div className="w-20 shrink-0 text-xs text-slate-500">
                {showReassign ? (
                  <select value={c.agent || ""} onClick={(e) => e.stopPropagation()} onChange={(e) => reassign(c.id, e.target.value || null)}
                    className="text-xs border border-slate-200 rounded-md px-1.5 py-1 outline-none w-full">
                    <option value="">—</option>
                    {AGENTS.map((a) => <option key={a} value={a}>{a}</option>)}
                  </select>
                ) : (c.agent || "—")}
              </div>
            )}
            <div className="w-24 shrink-0 text-xs text-slate-400 text-right">{timeAgo(c.lastContactAt)}</div>
            <div className="w-28 shrink-0 text-right">
              {!c.agent && onAssign ? (
                <button onClick={(e) => { e.stopPropagation(); onAssign(c.id); }}
                  className="text-xs font-medium px-3 py-1.5 rounded-md text-white whitespace-nowrap"
                  style={{ backgroundColor: BRAND.mid }}>
                  M'attribuer
                </button>
              ) : (
                <span className="text-slate-300 ml-auto">›</span>
              )}
            </div>
          </div>
        );
      })}
      {list.length === 0 && <div className="p-8 text-center text-sm text-slate-400">Aucun candidat pour ces filtres.</div>}
    </div>
  );
}

function Field({ label, value, span2 }) {
  return (
    <div className={span2 ? "col-span-2" : ""}>
      <div className="text-xs text-slate-400 mb-0.5">{label}</div>
      <div className="text-slate-700">{value}</div>
    </div>
  );
}

function StatChip({ icon, label, value, highlight }) {
  const palette = highlight === "amber" ? { bg: "#FFFBEB", fg: "#B45309" } : highlight === "hot" ? { bg: "#FEF2F2", fg: "#B91C1C" } : { bg: BRAND.mint, fg: BRAND.ink };
  return (
    <div className="bg-white rounded-xl border border-slate-200 px-4 py-3 flex items-center gap-3">
      <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-sm" style={{ backgroundColor: palette.bg, color: palette.fg }}>{icon}</div>
      <div>
        <div className="text-lg font-semibold text-slate-800 leading-none">{value}</div>
        <div className="text-xs text-slate-400 mt-0.5">{label}</div>
      </div>
    </div>
  );
}

function AdminCard({ icon, label, value }) {
  return (
    <div className="bg-white rounded-xl border border-slate-200 px-4 py-3.5">
      <div className="flex items-center gap-2 text-xs text-slate-400 mb-1.5"><span>{icon}</span>{label}</div>
      <div className="text-lg font-semibold" style={{ color: BRAND.ink }}>{value}</div>
    </div>
  );
}

ReactDOM.render(<MissionHiredCRM />, document.getElementById("root"));
</script>
</body>
</html>
